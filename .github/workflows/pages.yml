name: Publish BARBAROSSA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Unpack website
        run: |
          mkdir public
          for bundle in site-*.zip; do unzip -q "$bundle" -d public; done
          test -s public/index.html && test -s public/menu/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
